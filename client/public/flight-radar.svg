  50% { transform: rotate(180deg) scale(1); }
  100% { transform: rotate(360deg) scale(1); }
}
@keyframes appearDisappear { 
  0% { opacity: 0; }
  20% { opacity: 0; }
  30% { opacity: 1; }
  50% { opacity: 1; }
  70% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; }
}
.flare { fill: #9499a5; transform-box: fill-box; transform-origin: center; transform: scale(0); }
.f-anim1 { animation: 1.8s ease-out 0.5s infinite flareScale; }
.f-anim2 { animation: 1.8s ease-out infinite flareScale; }
.f-anim3 { animation: 1.8s ease-out infinite flareScaleBig; }
@keyframes flareScale {
  0% { transform: scale(0.3); }
  100% { transform: scale(1.6); opacity: 0; }
}
@keyframes flareScaleBig {
  0% { transform: scale(0.3); opacity: 0.5; }
  100% { transform: scale(3); opacity: 0; }
}</style>
